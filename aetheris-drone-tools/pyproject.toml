[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-drone-tools"
version = "0.1.0"
description = "Ferramentas de investigação e recepção de vídeo para drones de consumo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aetheris contributors" }]
dependencies = ["opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aetheris-video = "aetheris_drone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
